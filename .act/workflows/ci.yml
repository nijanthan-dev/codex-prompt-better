name: Local CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Toolchain
        run: |
          go version
          gitleaks version
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -count=1 -race ./...
      - name: Binary integration
        run: go test -count=1 -tags=integration ./cmd/prompt-better ./cmd/prompt-better-mcp
      - name: Contracts
        run: go run ./scripts/validate_contracts.go
      - name: Native smoke
        run: go run ./cmd/prompt-better improve_prompt 'Return a synthetic result.'
      - name: Secret scan
        run: gitleaks dir --no-banner --redact .

  cross-build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
          - windows
    steps:
      - name: Build
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: ${{ matrix.goos }}
        run: |
          go build -trimpath -o /tmp/prompt-better-${{ matrix.goos }} ./cmd/prompt-better
          go build -trimpath -o /tmp/prompt-better-collector-${{ matrix.goos }} ./cmd/prompt-better-collector
          go build -trimpath -o /tmp/prompt-better-mcp-${{ matrix.goos }} ./cmd/prompt-better-mcp

  postgres:
    name: PostgreSQL ${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 16
            host: prompt-better-act-pg16
          - major: 17
            host: prompt-better-act-pg17
    steps:
      - name: PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable
          TEST_POSTGRES_MAJOR: ${{ matrix.major }}
        run: go test -count=1 -tags=integration ./internal/store/postgres ./internal/retention ./internal/recovery ./cmd/prompt-better-collector
      - name: Doctor PostgreSQL readiness
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable
        run: go test -count=1 -tags=integration ./internal/setup
