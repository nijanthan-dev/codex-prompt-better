name: Local CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Toolchain
        run: |
          go version
          gitleaks version
          govulncheck -version
          goreleaser --version
          syft version
          shellcheck --version
      - name: Module consistency
        run: |
          root="$PWD"
          temp="$(mktemp -d)"
          cp -R . "${temp}/repo"
          cd "${temp}/repo"
          go mod tidy
          cmp go.mod "${root}/go.mod"
          cmp go.sum "${root}/go.sum"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Generated ERD
        run: go run ./scripts/generate-erd.go --check
      - name: Shell
        run: shellcheck scripts/*.sh
      - name: Review patterns
        run: go run ./scripts/validate_patterns.go
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerabilities
        run: govulncheck -db=file:///opt/go-vulndb ./...
      - name: Race
        run: go test -count=1 -race ./...
      - name: Binary integration
        run: go test -count=1 -tags=integration ./cmd/prompt-better ./cmd/prompt-better-mcp
      - name: Contracts
        run: go run ./scripts/validate_contracts.go
      - name: Native smoke
        run: go run ./cmd/prompt-better improve_prompt 'Return a synthetic result.'
      - name: Secret scan
        run: gitleaks dir --no-banner --redact .

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Build
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          go build -trimpath -o /tmp/prompt-better-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/prompt-better
          go build -trimpath -o /tmp/prompt-better-collector-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/prompt-better-collector
          go build -trimpath -o /tmp/prompt-better-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/prompt-better-mcp
          go build -trimpath -o /tmp/prompt-better-admin-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/prompt-better-admin

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Snapshot A
        run: scripts/package-release.sh snapshot /tmp/prompt-better-package-a
      - name: Snapshot B
        run: scripts/package-release.sh snapshot /tmp/prompt-better-package-b
      - name: Reproducible output
        run: |
          find /tmp/prompt-better-package-a -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/package-a-files
          find /tmp/prompt-better-package-b -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/package-b-files
          cmp /tmp/package-a-files /tmp/package-b-files
          while IFS= read -r name; do
            cmp "/tmp/prompt-better-package-a/${name}" "/tmp/prompt-better-package-b/${name}"
          done < /tmp/package-a-files
          gitleaks dir --no-banner --redact /tmp/prompt-better-package-a

  postgres:
    name: PostgreSQL ${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 16
            host: prompt-better-act-pg16
          - major: 17
            host: prompt-better-act-pg17
    steps:
      - name: PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable
          TEST_RUNTIME_DATABASE_URL: postgres://prompt_better_runtime_test:synthetic-runtime-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable&options=-c%20role%3Dprompt_better_runtime
          TEST_COLLECTOR_DATABASE_URL: postgres://prompt_better_collector_test:synthetic-collector-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable&options=-c%20role%3Dprompt_better_collector
          TEST_POSTGRES_MAJOR: ${{ matrix.major }}
        run: |
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --file migrations/admin/roles.sql
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE prompt_better_runtime_test LOGIN PASSWORD 'synthetic-runtime-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE prompt_better_collector_test LOGIN PASSWORD 'synthetic-collector-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT prompt_better_runtime TO prompt_better_runtime_test;
          GRANT prompt_better_collector TO prompt_better_collector_test;
          SQL
          go test -p=1 -count=1 -tags=integration ./internal/store/postgres ./internal/retention ./internal/recovery ./cmd/prompt-better-collector
      - name: Verify ERD against PostgreSQL catalog
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable
        run: go run ./scripts/generate-erd.go --check --database "$TEST_DATABASE_URL"
      - name: Doctor PostgreSQL readiness
        env:
          TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable
          TEST_RUNTIME_DATABASE_URL: postgres://prompt_better_runtime_test:synthetic-runtime-only@${{ matrix.host }}:5432/prompt_better_test?sslmode=disable&options=-c%20role%3Dprompt_better_runtime
        run: go test -count=1 -tags=integration ./internal/setup
