name: Local CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Toolchain
        run: |
          go version
          gitleaks version
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -count=1 -race ./...
      - name: Binary integration
        run: go test -count=1 -tags=integration ./cmd/prompt-better
      - name: Contracts
        run: go run ./scripts/validate_contracts.go
      - name: Native smoke
        run: go run ./cmd/prompt-better improve_prompt 'Return a synthetic result.'
      - name: Secret scan
        run: gitleaks dir --no-banner --redact .

  cross-build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
          - windows
    steps:
      - name: Build
        env:
          GOARCH: amd64
          GOOS: ${{ matrix.goos }}
        run: go build -trimpath -o /tmp/prompt-better-${{ matrix.goos }} ./cmd/prompt-better
